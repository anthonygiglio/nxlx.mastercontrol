name: apt package cache
description: >
  Restores and saves the .deb files that tools/ci-apt.sh downloads, so a job installs without the runner's mirror
  when the same packages were installed before (J-173). Put it after checkout and before the first ci-apt.sh step,
  and give it every package the job installs. The key holds the runner image and a hash of the package list; an
  older cache of the same job is used as a fallback, and apt ignores any file whose version the lists no longer offer.
inputs:
  packages:
    description: every package name the job gives to tools/ci-apt.sh, in any order
    required: true
runs:
  using: composite
  steps:
    - name: Work out the cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        JOB: ${{ github.job }}
      run: |
        hash="$(printf '%s\n' $PACKAGES | sort -u | sha256sum | cut -c1-16)"
        echo "prefix=apt-${RUNNER_OS}-${JOB}-${hash}" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "CI_APT_CACHE=$HOME/apt-cache" >> "$GITHUB_ENV"
    - name: Restore and later save the packages
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: ${{ steps.key.outputs.prefix }}-${{ steps.key.outputs.image }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}-
          apt-${{ runner.os }}-${{ github.job }}-
