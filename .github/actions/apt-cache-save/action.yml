name: apt package cache (save)
description: >
  Saves the folder that ./.github/actions/apt-cache restored and tools/ci-apt.sh added to, under a key of this run
  and attempt, so the next restore finds the newest one. Use it with `if: always()` as the last step of the job: it
  then runs when the install gave up too (J-173).
inputs:
  packages:
    description: the same packages that were given to ./.github/actions/apt-cache
    required: true
runs:
  using: composite
  steps:
    - name: Work out the cache key
      id: key
      shell: bash
      run: bash "${{ github.action_path }}/../apt-cache/key.sh" "${{ inputs.packages }}"
    - name: Save the packages
      uses: actions/cache/save@v4
      with:
        path: ~/apt-cache
        key: ${{ steps.key.outputs.base }}-${{ github.run_id }}-${{ github.run_attempt }}
