name: pvj platform layer

on:
  push:
  pull_request:

permissions:
  contents: read

# Every job has an end, and every step that downloads has an earlier one. On 2026-10-05 a panel-ui job spent more
# than twenty minutes in "Install mpv and a browser" (usually 45 seconds): that runner got its packages at about
# 50 kB a second. With no limit of its own a job may go on for six hours. A step that runs out of time fails with
# what it had printed, and a rerun lands on another runner. Since 2026-10-08 the package installs go through
# tools/ci-apt.sh, which gives a slow mirror 90 seconds a step and tries three times, because the ten minutes ran out
# about ten times in three days.
jobs:
  test:
    runs-on: ubuntu-latest
    # A whole job takes about 22 minutes. One once sat in the unit tests for 35 until it was cancelled, and a
    # cancelled job keeps no log; so the job has an end, and the unit tests have an earlier one that says where.
    timeout-minutes: 45
    strategy:
      # Each Python gives its own answer. Without this a failure on one cancelled the other mid-step, and a
      # cancelled job keeps no log: half the evidence of a failure that comes and goes was thrown away.
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch the release before owner recovery (the rollback test of D81 runs its Auth on a file written here)
        run: git fetch --depth=1 origin b62f203a5c45fc0c20386a8ab476ad3d7b511736
      - name: Fetch the release before OSC state feedback (the rollback test of D82 runs its receiver on a file written here)
        run: git fetch --depth=1 origin b7864886e53e850f6df057c6e12ad144fd077935
      - name: Fetch the release before OSC's safer defaults (the rollback test of D83 runs master's receiver on a file written here, and this code on a file master wrote)
        run: git fetch --depth=1 origin 106d77ffaa9f5ee213ae1fd4eecb15d5804a3cc5
      - name: Fetch master (a test of D79 reads master's settings.py; tests/test_ndi_review.py holds this step)
        run: git fetch --depth=1 origin +master:refs/remotes/origin/master
      - name: Fetch the release before NDI (the rollback tests of D62 and D85 run that release's code on a settings file written here)
        run: git fetch --depth=1 origin f36f8f0d040a35a6ecc72fb8a1001273b7f7ba0d
      - name: Fetch the release before the screen's mode (the rollback test of D90 runs that release's code on a settings file written here)
        run: git fetch --depth=1 origin 33e7eb419eb1b26b08618dd54b3e1481d4b60f0e
      - name: Fetch the release before Automatic picture detail (the rollback test of D93 runs that release's shader settings on a file written here)
        run: git fetch --depth=1 origin 0648db6b014db99ee890fc931353ea861fe41d7f
      - name: The release before D94 (render nodes), for the rollback test of tests/test_render.py
        run: git fetch --depth=1 origin 1ed58bcbb5acf8b1b4122b40c3f480b186957f8d
      - name: The release before D96 (sound reactivity), for the rollback test of tests/test_sound.py
        run: git fetch --depth=1 origin 9ca9cbf71bce6258813c18b3d4c87fd8cda46397
      - name: The release before D97 (sound sources), for the rollback test of tests/test_sound_sources.py
        run: git fetch --depth=1 origin 5a3a1c6c593cb387706afa488c5eeb79923860e3
      - name: Install mpv
        timeout-minutes: 10   # usually half a minute; see the note at the top of this file
        run: tools/ci-apt.sh mpv
      - name: Unit tests (real mpv, headless)
        # About eighteen minutes on master by 2026-10-11 (2,400 tests); with the NDI input's tests (real pipes, measured
        # waits) it is past twenty, so the limit here is thirty. After that, SIGABRT: faulthandler prints every thread's
        # stack and the step fails (the job's own limit above is 45). The 25 slowest tests are printed at the end,
        # so what makes the suite long is seen (on Python 3.12 only: 3.9's unittest has no --durations).
        run: timeout -s ABRT 1800 python -X faulthandler -m unittest discover -s tests -t . -v ${{ matrix.python == '3.12' && '--durations 25' || '' }}
      - name: Shaders on a real mpv with a software GPU (xvfb, Mesa; a skip here is a failure)
        run: |
          tools/ci-apt.sh xvfb xauth libegl1 libgles2 libgl1-mesa-dri
          PVJ_GPU_TEST=1 xvfb-run -a -s "-screen 0 1280x720x24" python -m tests.test_shaders_gpu
      - name: Performing with shaders on the real mpv (values, speed, presets, no black frame; a skip is a failure)
        run: PVJ_GPU_TEST=1 xvfb-run -a -s "-screen 0 1280x720x24" python -m tests.test_shaderlive_gpu
      - name: The same on desktop OpenGL 3.1 with GLSL 1.40, the context mpv makes on a Raspberry Pi 4
        run: MESA_GL_VERSION_OVERRIDE=3.1 MESA_GLSL_VERSION_OVERRIDE=140 PVJ_GPU_TEST=1 PVJ_GPU_ONLY=desktop xvfb-run -a -s "-screen 0 1280x720x24" python -m tests.test_shaderlive_gpu

  effects-gpu:
    # Effects (ISF filters over the playing picture) on a real mpv that draws: jobs of their own, so their answer does
    # not wait for the long test job. Three ways of drawing: OpenGL ES, desktop OpenGL, and desktop OpenGL 3.1 with
    # GLSL 1.40, the context mpv makes on a Raspberry Pi 4. A software GPU: nothing here says how fast a board is.
    runs-on: ubuntu-latest
    timeout-minutes: 30       # about ten
    strategy:
      fail-fast: false
      matrix:
        include:
          - way: OpenGL ES
            env: PVJ_GPU_ONLY=gles
          - way: desktop OpenGL
            env: PVJ_GPU_ONLY=desktop
          - way: desktop OpenGL 3.1 with GLSL 1.40 (a Raspberry Pi 4)
            env: PVJ_GPU_ONLY=desktop MESA_GL_VERSION_OVERRIDE=3.1 MESA_GLSL_VERSION_OVERRIDE=140
    name: effects-gpu (${{ matrix.way }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mpv, a virtual display and Mesa
        timeout-minutes: 10
        run: tools/ci-apt.sh mpv xvfb xauth libegl1 libgles2 libgl1-mesa-dri
      - name: Effects on the real mpv (a skip here is a failure)
        run: env ${{ matrix.env }} PVJ_GPU_TEST=1 xvfb-run -a -s "-screen 0 1280x720x24" python -m tests.test_effects_gpu

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the installer and image scripts (strict)
        run: shellcheck install/install.sh tools/make-release.sh image/stage-pvj/prerun.sh image/stage-pvj/00-install-pvj/01-run.sh tests/real_install_test.sh

  real-install:
    # The installer run for real, as root, under the runner's systemd: who owns what in /run/pvj after an upgrade
    # over an old shared folder, restarts, a crash and a reinstall (D45). The runner is thrown away afterwards.
    # Not a test of a Raspberry Pi: no display, and not the box's systemd.
    runs-on: ubuntu-latest
    timeout-minutes: 25       # about ten since the NDI hand-over steps (each looks at mpv for ten seconds)
    steps:
      - uses: actions/checkout@v4
      - name: Install mpv
        timeout-minutes: 10   # usually half a minute; see the note at the top of this file
        run: tools/ci-apt.sh mpv
      - name: The mpv of this job (Ubuntu's, NOT the Pi's; the job ndi-mpv runs the Pi's)
        run: mpv --version | head -n 1
      - name: Real install as root and the owners of the runtime folders
        run: sudo PVJ_REAL_INSTALL_TEST=yes-this-machine-is-disposable bash tests/real_install_test.sh

  ndi-mpv:
    # The NDI input against the mpv the Pi runs. On 2026-10-12 a mended hand-over of the pipe was green in real-install
    # (Ubuntu's mpv 0.37) and still stuck on the owner's Pi (Debian 13 "trixie", mpv 0.40): a green run on another mpv
    # proved nothing for the box. So this job runs in the Pi's own distribution and FAILS if its mpv is not 0.40.x:
    # when Debian moves on, the Pi will at its next upgrade, and somebody must look at both.
    # No systemd here (that stays in real-install): the helper's real code with the stand-in for NDI's library, a real
    # pipe, the panel's real Api, and a real mpv started by the real Player (tests/test_ndi_mpv.py). The container is
    # x86_64, not a Pi: the same mpv release, not the same processor, GPU or sound.
    name: "ndi-mpv (Debian 13, the Pi's mpv)"
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install python3, mpv, a C compiler and git (three tries; a slow mirror is given up on)
        timeout-minutes: 10
        run: |
          for n in 1 2 3; do
            if apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends python3 mpv gcc libc6-dev git ca-certificates; then
              exit 0
            fi
            echo "attempt $n failed"
            sleep 5
          done
          exit 1
      - uses: actions/checkout@v4
      - name: The mpv here must be the Pi's (0.40.x), or this job says nothing about the Pi
        run: |
          said="$(mpv --version | head -n 1)"
          echo "$said"
          cat /etc/debian_version
          python3 --version
          case "$said" in
            "mpv v0.40."*|"mpv 0.40."*) echo "the Pi's release of mpv" ;;
            *) echo "::error::this job is for mpv 0.40.x (the Pi, Debian 13) and apt gave: $said"; exit 1 ;;
          esac
      - name: An account without privileges for the tests (in a container the job is root, and tests of refusals need not to be)
        run: |
          useradd --create-home ci
          chown -R ci: .
      - name: NDI against this mpv (the stand-in library, the real helper code, the real Api, the real Player; findings are printed, see the test's top)
        timeout-minutes: 30
        # PVJ_NDI_FINDINGS_FATAL=yes since the mending (2026-10-12): the cases that failed on master's pvj fail the job
        # here too. Without it they are printed as FINDING and skipped.
        # Sound from another sender (D87, cases 40 to 46) is in the same run and fatal, every one of them: nothing
        # of it is under the switch. test_47 is for the record and never fatal.
        run: su ci -c "PVJ_NDI_MPV_TEST=1 PVJ_NDI_MPV_WANT=0.40. PVJ_NDI_FINDINGS_FATAL=yes python3 -X faulthandler -m unittest -v tests.test_ndi_mpv"
      - name: The crossfade's smaller still on this mpv (D89, overlay-add with a display size; a virtual display and Mesa's software GPU; a skip is a failure)
        # mpv 0.38 on draws an overlay at a size of its own; the other jobs run Ubuntu's 0.37, which refuses it, so
        # this is the one job where the scaled still is drawn by a real mpv. A software GPU in a 320 x 180 window on
        # x86_64: what it shows is the commands and the places, not a Pi's timings.
        timeout-minutes: 15
        run: |
          ok=0
          for n in 1 2 3; do
            if apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends xvfb xauth libegl1 libgles2 libgl1-mesa-dri; then
              ok=1
              break
            fi
            echo "attempt $n failed"
            sleep 5
          done
          [ "$ok" = 1 ] || exit 1
          su ci -c "PVJ_GPU_TEST=1 PVJ_GPU_ONLY=gles PVJ_SCALE_WANT=yes xvfb-run -a -s '-screen 0 1280x720x24' python3 -X faulthandler -m unittest -v tests.test_transitions_gpu.GlesScaledTest" > /tmp/scaled.txt 2>&1 || code=$?
          cat /tmp/scaled.txt
          if grep -q -E "skipped|OK \(skipped" /tmp/scaled.txt; then
            echo "::error::the scaled still's tests were skipped: they judge nothing here"
            exit 1
          fi
          grep -q -E "^Ran [1-9]" /tmp/scaled.txt || { echo "::error::no test of the scaled still ran"; exit 1; }
          exit "${code:-0}"
      - name: The screen's mode against the Pi's mpv (D90; the --drm-mode texts and the test pattern's graph, no screen here)
        timeout-minutes: 5
        run: su ci -c "python3 -X faulthandler -m unittest -v tests.test_screenmode.RealMpvTest"
      - name: The still-with-sound cases on the pvj code that was stuck on the Pi (master at 5f62763) must FAIL there, or they judge nothing
        # The same tests and the same stand-in, with the pvj folder of the commit before the hand-over of the pipe and
        # the player's options for a standing picture were mended. A case that passes on that code would have been
        # green while the Pi was stuck. A failure only counts when it is the judge's own (STUCK, SILENT LOSS or NOT
        # BACK in what the test printed), not when the old code and the new tests do not fit together.
        timeout-minutes: 15
        run: |
          su ci -c "git fetch --depth=1 origin 5f6276307febe1ca1da9b4942de6734224f49133"
          su ci -c "rm -rf /tmp/stuck && mkdir /tmp/stuck && cp -a tests /tmp/stuck/ && git archive 5f6276307febe1ca1da9b4942de6734224f49133 pvj | tar -x -C /tmp/stuck"
          bad=0
          for t in test_13_one_still_picture_then_only_sound_for_thirty_five_seconds test_15_one_still_picture_then_sound_after_a_short_gap test_16_one_still_picture_then_sound_after_a_long_gap; do
            if su ci -c "cd /tmp/stuck && PVJ_NDI_MPV_TEST=1 PVJ_NDI_FINDINGS_FATAL=yes python3 -m unittest tests.test_ndi_mpv.NdiOnARealMpv.$t" > /tmp/stuck/out.txt 2>&1; then
              echo "::error::$t PASSES on the code that was stuck on the Pi: it does not judge what the Pi showed"
              tail -n 40 /tmp/stuck/out.txt
              bad=1
            elif grep -q -E "AssertionError: on mpv.*(STUCK|SILENT LOSS|NOT BACK)" /tmp/stuck/out.txt; then
              echo "AS IT MUST: $t fails on the code that was stuck on the Pi:"
              grep -E "AssertionError: on mpv" /tmp/stuck/out.txt | cut -c1-700
            else
              echo "::error::$t failed on the old code for another reason than the judge's (the old code and these tests do not fit?)"
              tail -n 60 /tmp/stuck/out.txt
              bad=1
            fi
          done
          # One sync case too, for the record and without a verdict: first sound late by a fifth of a second gave
          # avsync 0.206 for 1.8 seconds on the helper as it was before 7d59ead; what master's does is printed here.
          t=test_31_sync_first_sound_late_by_a_fifth_of_a_second
          if su ci -c "cd /tmp/stuck && PVJ_NDI_MPV_TEST=1 PVJ_NDI_FINDINGS_FATAL=yes python3 -m unittest tests.test_ndi_mpv.NdiOnARealMpv.$t" > /tmp/stuck/out.txt 2>&1; then
            echo "FOR THE RECORD: $t PASSES on the code from before the mending (this sync case does not tell the two apart):"
          else
            echo "FOR THE RECORD: $t FAILS on the code from before the mending:"
            grep -E "AssertionError: on mpv" /tmp/stuck/out.txt | cut -c1-900
          fi
          grep -E "^SYNC " /tmp/stuck/out.txt | cut -c1-400 || true
          exit "$bad"
      - name: The whole suite on this mpv, for information (it may fail for reasons of the container; its result does not decide the job until a run was read)
        # First run 2026-10-12 (Python 3.13, mpv 0.40, no rollback commits fetched): it did not finish. After 35 minutes
        # it stood in a test server's shutdown, with 2,751 tests passed, 6 errors and 2 failures whose names were not
        # printed. So it runs with -v now, to name them; it still does not decide the job.
        continue-on-error: true
        timeout-minutes: 40
        run: |
          start="$(date +%s)"
          code=0
          su ci -c "timeout -s ABRT 2100 python3 -X faulthandler -m unittest discover -s tests -t . -v" || code=$?
          echo "THE WHOLE SUITE ON $(mpv --version | head -n 1): exit $code after $(( $(date +%s) - start )) seconds"
          exit "$code"

  pvj-render:
    # The box's own renderer (render/, D95): built with every warning an error, then run for real, headless (EGL
    # without a surface on Mesa's software GPU, llvmpipe): a picture, a clip, the mapping, an overlay, text, the
    # socket's answers and refusals, read back by their pixels (tests/test_pvj_render.py), and the player's side
    # against a stand-in helper (tests/test_renderer.py). Twice: on Ubuntu, and on Debian 13 (the Pi's distribution
    # and its libmpv of mpv 0.40, the release the Pi runs; the job fails on another). x86_64 both times: the same
    # source and the same libmpv release, not the Pi's processor, GPU or screen. A skip here is a failure.
    name: pvj-render (${{ matrix.where }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: Ubuntu
            container: ''
          - where: Debian 13, the Pi's mpv
            container: debian:trixie
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      PKGS: gcc make pkg-config libc6-dev libmpv-dev libegl-dev libgles-dev libgbm-dev libdrm-dev libgl1-mesa-dri libegl-mesa0 ffmpeg fonts-dejavu-core python3 git ca-certificates
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools, libmpv, Mesa, ffmpeg and a font (three tries; a slow mirror is given up on)
        timeout-minutes: 12
        run: |
          if [ -z "${{ matrix.container }}" ]; then
            tools/ci-apt.sh $PKGS
            exit $?
          fi
          for n in 1 2 3; do
            if apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends $PKGS; then
              exit 0
            fi
            echo "attempt $n failed"
            sleep 5
          done
          exit 1
      - name: What it is built against
        run: |
          pkg-config --modversion mpv egl glesv2 gbm libdrm
          cat /etc/os-release | head -n 2
          if [ -n "${{ matrix.container }}" ]; then
            v="$(dpkg-query -W -f '${Version}' libmpv-dev)"
            echo "libmpv-dev $v"
            case "$v" in
              0.40.*) echo "the Pi's release of mpv" ;;
              *) echo "::error::this job is for mpv 0.40.x (the Pi, Debian 13) and apt gave libmpv-dev $v"; exit 1 ;;
            esac
          fi
      - name: Build pvj-render (every warning an error)
        run: make -C render WERROR=1
      - name: An account without privileges for the tests (in a container the job is root)
        if: matrix.container != ''
        run: |
          useradd --create-home ci
          chown -R ci: .
      - name: pvj-render for real, headless, and the player's side (a skip is a failure)
        timeout-minutes: 15
        run: |
          run="PVJ_RENDER_TEST=1 LIBGL_ALWAYS_SOFTWARE=1 python3 -X faulthandler -m unittest -v tests.test_pvj_render tests.test_renderer"
          if [ -n "${{ matrix.container }}" ]; then su ci -c "$run" > /tmp/render.txt 2>&1 || code=$?
          else sh -c "$run" > /tmp/render.txt 2>&1 || code=$?; fi
          cat /tmp/render.txt
          if grep -q -E "skipped|OK \(skipped" /tmp/render.txt; then
            echo "::error::a test of pvj-render was skipped: it judges nothing here"
            exit 1
          fi
          grep -q -E "^Ran [1-9]" /tmp/render.txt || { echo "::error::no test ran"; exit 1; }
          exit "${code:-0}"

  panel-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # about seven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mpv and a browser
        timeout-minutes: 10
        run: |
          tools/ci-apt.sh mpv
          mkdir /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install playwright@1.56.1 pngjs@7.0.0 ag-psd@31.0.2
          npx playwright install --with-deps chromium
      - name: Drive the real panel in a browser (CSP violations fail the test)
        run: NODE_PATH=/tmp/pw/node_modules node tests/ui/panel.test.js
      - name: The design sandbox in each role (tools/sandbox, D103)
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: NODE_PATH=/tmp/pw/node_modules node tests/ui/sandbox.test.js
      - name: Take the cropped screenshots (docs/images/ui)
        continue-on-error: true   # documentation only: never blocks a merge
        if: ${{ !cancelled() }}   # also when the browser test failed: the pictures often show why
        run: SHOTS="$RUNNER_TEMP/ui-shots" MOCKUPS="$RUNNER_TEMP/ui-mockups" NODE_PATH=/tmp/pw/node_modules node tests/ui/screenshots.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-shots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4   # editable mock-up files (SVG, layered PSD) of every screen
        if: always()
        with:
          name: ui-mockups
          path: ${{ runner.temp }}/ui-mockups/
          if-no-files-found: warn
