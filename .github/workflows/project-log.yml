name: Project log

# The log is one new file per pull request (D107, project-log/README.md). This check fails a pull request that
# edits the three old files, edits or deletes a log file of an earlier pull request, adds a file with a bad name or
# date, gives a new decision a number the base branch already has, or adds no journal file. The label "no-journal"
# lets a trivial change through without one; adding or removing a label runs the check again (it takes seconds).
# On a push to master it looks at the files alone: two pull requests that took one number and both merged (the
# ruleset does not ask for a branch up to date) show red there at once, not only in the next pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  project-log:
    name: project-log
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A pull request's run is on GitHub's test merge of it into its base branch: HEAD^1 is that branch's tip, so
      # the check sees what the pull request changes and what the base already has (its decision numbers). Two
      # commits are enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The log's files, and what this pull request changed in them (tools/project-log.py check)
        if: github.event_name == 'pull_request'
        env:
          NO_JOURNAL: ${{ contains(github.event.pull_request.labels.*.name, 'no-journal') && '--no-journal-ok' || '' }}
        run: python3 tools/project-log.py check --base HEAD^1 $NO_JOURNAL
      - name: The log's files on master (names, dates, headings, a number used twice)
        if: github.event_name == 'push'
        run: python3 tools/project-log.py check
