name: Security tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  endpoints:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: tests/security_test.sh
