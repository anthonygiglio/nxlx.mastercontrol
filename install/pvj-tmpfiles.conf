# Runtime folders of nxlx.mastercontrol (pvj/paths.py, D45). Installed as /etc/tmpfiles.d/pvj.conf.
#
# The parent of the services' folders belongs to root, so that no service account can add, rename or remove a
# name in it (such as the folder that holds the root network helper's socket). systemd creates it the same way
# (root:root 0755) when a unit with RuntimeDirectory=pvj/<name> starts and it is missing; this line also puts it
# right when it already exists with another owner, as it does after an upgrade from a version whose units shared it.
d /run/pvj 0755 root root -
# The installer's note that this folder was made (or emptied) for the folder-per-service layout. At boot /run is
# empty, so there is nothing to empty; on a running box the installer runs this file only after an emptying has finished.
f /run/pvj/.d45 0644 root root -
# The panel's own folder, and in it two links for a panel from before D45 that an update rolled back to: it looks
# for both sockets in its own folder. The folder is the panel's, so the links can mislead nobody but the panel.
# This is the one place where root makes a name inside a folder an unprivileged account owns. It is a link, made
# with symlink(2), which never follows a name that is already there, and its owner and mode are not touched ("- -").
# Nothing else may be added here: no file, no chown, no chmod.
# Remove these three lines when no box can roll back to a version from before D45.
d /run/pvj/web 0750 pvj-web pvj -
L+ /run/pvj/web/player.sock - - - - /run/pvj/player/player.sock
L+ /run/pvj/web/netd.sock - - - - /run/pvj/netd/netd.sock
