version = 1
SPDX-PackageName = "nxlx.mastercontrol"

# Files that cannot carry a comment header, and documentation, written for this fork.
[[annotations]]
path = [
  "pvj/modules.d/**",
  "pvj/themes.d/**",
  "pvj/controllers.d/**",
  "pvj/shaders.d/*.fs",
  "pvj/shaders.d/isf-files/SHA256SUMS",
  "pvj/effects.d/*.fs",
  "pvj/effects.d/isf-files/SHA256SUMS",
  "pvj/*.md",
  "install/README.md",
  "image/README.md",
  "image/config",
  "image/stage-pvj/EXPORT_IMAGE",
  "image/stage-pvj/00-install-pvj/00-packages-nr",
  "image/stage-pvj/00-install-pvj/files/.gitkeep",
  "tools/panel-playground/*.json",
  "tools/theme-samples/*.json",
  "tools/sandbox/scenarios/*.json",
  "tools/max/*.maxpat",
  "tests/ui/fixtures/*.json",
  "tests/frozen_master_profile.json",
  "LICENSES/Apache-2.0.txt",
  "NOTICE.md",
  "SECURITY.md",
  "THIRD_PARTY_LICENSES.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NXLX.Systems and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Third-party shader packs: generators (pvj/shaders.d/isf-files) and filters (pvj/effects.d/isf-files) from Vidvox
# ISF-Files (https://github.com/Vidvox/ISF-Files), unchanged, under the MIT licence of that repository. Its LICENSE
# names no copyright holder ("Copyright (c) 2018"); each file names its author in its CREDIT field. See
# THIRD_PARTY_LICENSES.md for the commit, the file lists and the notices.
[[annotations]]
path = [
  "pvj/shaders.d/isf-files/*.fs",
  "pvj/shaders.d/isf-files/LICENSE",
  "pvj/effects.d/isf-files/*.fs",
  "pvj/effects.d/isf-files/LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 the authors of ISF-Files (VIDVOX and the people named in each file's CREDIT)"
SPDX-License-Identifier = "MIT"

# The two noise shaders also hold the simplex noise of https://github.com/ashima/webgl-noise (MIT), whose notice is
# kept beside them. This annotation comes last, so it is the one that counts for these three files.
[[annotations]]
path = [
  "pvj/shaders.d/isf-files/isf-simplex-noise.fs",
  "pvj/shaders.d/isf-files/isf-ridgelines.fs",
  "pvj/shaders.d/isf-files/LICENSE.webgl-noise",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2018 the authors of ISF-Files (VIDVOX and the people named in each file's CREDIT)",
  "2011 Ashima Arts",
  "2011-2016 Stefan Gustavson",
]
SPDX-License-Identifier = "MIT"

# Fonts of the panel's style "signal", shipped with the panel because a box at a venue has no internet. Both are under
# the SIL Open Font License 1.1 and are not this project's work. Each file is a subset made from the family's variable
# font in https://github.com/google/fonts (the commit, the commands and the checksums are in THIRD_PARTY_LICENSES.md);
# each family's own OFL.txt, with its copyright line, is kept beside the fonts.
[[annotations]]
path = [
  "pvj/web/fonts/archivo-latin.06fa7831.woff2",
  "pvj/web/fonts/OFL-Archivo.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "pvj/web/fonts/jetbrains-mono-500-latin.6c95bc2f.woff2",
  "pvj/web/fonts/OFL-JetBrainsMono.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Fonts the node draws text with (pvj/fonts, D129 slice 2 of design/text-and-logo-sources_2026-11-08.md). Eleven families, each
# the unchanged TrueType file of the release in https://github.com/google/fonts (commit and checksums in THIRD_PARTY_LICENSES.md), each with
# its own OFL.txt beside it, read from the same release. None is this project's work; all are SIL OFL 1.1. They are read by pvj-raster,
# never sent to a browser.
[[annotations]]
path = [
  "pvj/fonts/archivo.ttf",
