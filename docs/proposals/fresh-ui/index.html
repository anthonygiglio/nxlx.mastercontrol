<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MasterControl Panel Redesign</title>
<meta name="description" content="Click-through prototype of a fresh web panel for nxlx.mastercontrol, with a fake box and no network.">
<style>
/* ---------- Prototype chrome (outside the device) ---------- */
:root {
  --p-bg: #e9e7e1; --p-cd: #fbfaf7; --p-fg: #1c1c1c; --p-mu: #55554f; --p-ln: #c9c6bd; --p-ac: #1c1c1c;
  /* Panel tokens. They mirror pvj/themes.d (bg, cd, fg, ln, mu, ac, on); ok, wa, bd and hi are four new derived tokens. Default here: Light. */
  --bg: #f4f3ef; --cd: #ffffff; --fg: #1c1c1c; --ln: #1c1c1c; --mu: #55554f; --ac: #c2410c; --on: #ffffff;
  --ok: #0f7a3a; --wa: #8a5a00; --bd: #b42318; --hi: #ebe9e2;
  --t1: 11px; --t2: 14px; --t3: 16px; --t4: 20px; --t5: 28px; --t6: 40px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --r: 6px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --p-bg: #0e0e10; --p-cd: #18181b; --p-fg: #ececea; --p-mu: #a3a39e; --p-ln: #3a3a40; --p-ac: #ececea; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--p-bg); color: var(--p-fg); font: 15px/1.4 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
.proto { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; min-height: 100vh; }
.stage { display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.side { background: var(--p-cd); border: 1.5px solid var(--p-ln); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 14px; align-self: start; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.side h2 { font: 600 11px var(--mono); margin: 0 0 6px; color: var(--p-mu); text-transform: uppercase; letter-spacing: .08em; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .pbtn { flex: 1 1 auto; min-height: 36px; padding: 0 10px; border-radius: 6px; border: 1.5px solid var(--p-ln); background: transparent; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--p-ac); color: var(--p-cd); border-color: var(--p-ac); font-weight: 600; }
.journeys { display: flex; flex-direction: column; gap: 4px; }
.journeys button { text-align: left; min-height: 36px; padding: 6px 10px; border-radius: 6px; border: 1.5px solid var(--p-ln); background: transparent; cursor: pointer; font-size: 13px; }
.journeys button:hover { border-color: var(--p-fg); }
.hint { font-size: 13px; color: var(--p-mu); margin: 6px 0; }
.jhint { font-size: 13px; border: 1.5px dashed var(--p-fg); padding: 8px 10px; border-radius: 6px; }
.jhint:empty { display: none; }
.notes textarea { width: 100%; min-height: 120px; background: var(--p-bg); border: 1.5px solid var(--p-ln); border-radius: 6px; padding: 8px; resize: vertical; }
.notes .who { font-weight: 600; font-family: var(--mono); font-size: 12px; }
.notes pre { white-space: pre-wrap; font-size: 12px; background: var(--p-bg); border: 1.5px solid var(--p-ln); border-radius: 6px; padding: 8px; max-height: 200px; overflow: auto; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; min-height: 32px; }
.protobar { display: none; }
.closeside { display: none; }
@media (max-width: 760px) {
  .proto { display: block; padding: 0; }
  .protobar { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 12px; border-bottom: 1.5px solid var(--p-ln); background: var(--p-cd); font-size: 13px; }
  .protobar button { min-height: 36px; border-radius: 6px; border: 1.5px solid var(--p-ln); background: transparent; padding: 0 12px; cursor: pointer; }
  .side { display: none; position: fixed; inset: 0; z-index: 50; border-radius: 0; max-height: none; }
  .side.open { display: flex; }
  .closeside { display: block; min-height: 44px; }
  .stage { display: block; }
  .device { width: 100% !important; height: calc(100dvh - 44px) !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
}

/* ---------- The device ---------- */
.device { container: app / inline-size; position: relative; overflow: hidden; border: 10px solid #111; border-radius: 28px; background: var(--bg); box-shadow: 0 10px 40px rgba(0,0,0,.18); max-width: 100%; }
.device[data-size="phone"] { width: 390px; height: min(844px, calc(100vh - 32px)); }
.device[data-size="tablet"] { width: 820px; height: min(1100px, calc(100vh - 32px)); border-radius: 22px; }
.device[data-size="laptop"] { width: 1280px; height: min(800px, calc(100vh - 32px)); border-radius: 10px; border-width: 6px; }

/* Panel themes. Each mirrors a pvj/themes.d file; ok, wa, bd and hi are new. */
.app[data-theme="light"] { --bg: #f4f3ef; --cd: #ffffff; --fg: #1c1c1c; --ln: #1c1c1c; --mu: #55554f; --ac: #c2410c; --on: #ffffff; --ok: #0f7a3a; --wa: #8a5a00; --bd: #b42318; --hi: #ebe9e2; }
.app[data-theme="dark-stage"] { --bg: #121214; --cd: #1c1c20; --fg: #f2f1ec; --ln: #4a4a54; --mu: #a9a8a3; --ac: #f59e0b; --on: #1a1300; --ok: #5fd08a; --wa: #f5c451; --bd: #ff7a6e; --hi: #26262c; }
.app[data-theme="night-red"] { --bg: #000000; --cd: #140000; --fg: #ff6a5c; --ln: #6a1a14; --mu: #c2564b; --ac: #ff3b30; --on: #000000; --ok: #ff6a5c; --wa: #ff8a7c; --bd: #ff3b30; --hi: #220402; }
.app[data-theme="high-contrast"] { --bg: #000000; --cd: #000000; --fg: #ffffff; --ln: #ffffff; --mu: #e6e6e6; --ac: #ffff00; --on: #000000; --ok: #7cfc00; --wa: #ffff00; --bd: #ff6060; --hi: #1a1a1a; }

.app { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); background: var(--bg); color: var(--fg); font: 16px/1.35 var(--sans); -webkit-tap-highlight-color: transparent; }
.app button { touch-action: manipulation; }
.app :focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
.top { grid-row: 1; display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); min-height: 60px; }
.brand { font-weight: 700; font-size: var(--t4); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { min-height: 44px; padding: 0 var(--s3); border-radius: 22px; border: 1.5px solid var(--ln); background: var(--cd); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; color: var(--fg); }
@container app (max-width: 420px) { .pill .opt { display: none; } }
.pill.slow { border-color: var(--wa); color: var(--wa); }
.pill.lost { border-color: var(--bd); color: var(--bd); border-style: dashed; }
.banner { grid-row: 2; margin: 0 var(--s4) var(--s2); padding: var(--s2) var(--s3); font-size: var(--t2); border: 1.5px dashed var(--ln); border-radius: var(--r); background: var(--hi); display: flex; gap: var(--s2); align-items: center; }
.banner:empty { display: none; }
.banner.bad { color: var(--bd); border-color: var(--bd); }
.banner .grow { flex: 1; }
.scroll { grid-row: 3; overflow-y: auto; overflow-x: hidden; padding: var(--s2) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); overscroll-behavior: contain; }
.nav { grid-row: 4; display: flex; gap: var(--s2); padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom)); border-top: 1.5px solid var(--ln); background: var(--bg); }
.nav button { flex: 1 1 0; min-height: 48px; border: 1.5px solid var(--ln); background: var(--cd); border-radius: var(--r); font-size: var(--t3); font-weight: 600; cursor: pointer; color: var(--fg); }
.nav button[aria-current="page"] { background: var(--ac); border-color: var(--ac); color: var(--on); }
.sidebar { display: none; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }

h1 { font-size: var(--t5); margin: 0; line-height: 1.15; }
h2 { font-size: var(--t3); margin: 0; }
.lbl { font: 500 var(--t1) var(--mono); color: var(--mu); text-transform: uppercase; letter-spacing: .08em; }
.sub { font-size: var(--t2); color: var(--mu); margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: var(--s2); align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--s2); }
.card { background: var(--cd); border: 1.5px solid var(--ln); border-radius: var(--r); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.card.dashed { border-style: dashed; background: var(--hi); }
.btn { min-height: 48px; padding: 0 var(--s4); border-radius: var(--r); border: 1.5px solid var(--ln); background: var(--cd); color: var(--fg); font-weight: 600; font-size: var(--t3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); text-align: center; }
.btn.primary { background: var(--ac); border-color: var(--ac); color: var(--on); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--mu); }
.btn.small { min-height: 44px; font-size: var(--t2); padding: 0 var(--s3); }
.btn.danger { color: var(--bd); border-color: var(--bd); }
.btn[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--on); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.armed, .switch.armed { background: var(--bd); border-color: var(--bd); color: var(--bg); }
.pending { position: relative; }
.pending::after { content: ""; position: absolute; inset: -5px; border-radius: 8px; border: 2px dashed var(--ac); animation: pend 1s linear infinite; pointer-events: none; }
@keyframes pend { 50% { opacity: .2; } }
.state { font: 600 var(--t1) var(--mono); text-transform: uppercase; letter-spacing: .06em; display: inline-flex; gap: 6px; align-items: center; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mu); flex: none; }
.state.on::before { background: var(--ok); }
.state.wait::before { background: var(--wa); animation: pend 1s linear infinite; }
.state.bad { color: var(--bd); }
.state.bad::before { background: transparent; border: 2px solid var(--bd); width: 5px; height: 5px; }
.tag { font: 600 var(--t1) var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 6px; border-radius: 4px; border: 1.5px solid var(--ln); white-space: nowrap; }
.tag.lit { background: var(--ac); border-color: var(--ac); color: var(--on); }
.tag.ink { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* Now playing, on every screen */
.now { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--s3); align-items: center; cursor: pointer; text-align: left; width: 100%; background: var(--cd); border: 1.5px solid var(--ln); border-radius: var(--r); padding: var(--s3) var(--s4); color: inherit; }
.now .what { grid-column: 1 / -1; font-weight: 700; font-size: var(--t4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .lbl { grid-column: 1 / -1; display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.now .time { font: 500 var(--t2) var(--mono); font-variant-numeric: tabular-nums; }
.now .next { font: 500 var(--t1) var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mu); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bar { grid-column: 1 / -1; height: 10px; border-radius: 5px; border: 1.5px solid var(--ln); overflow: hidden; background: var(--bg); }
.bar i { display: block; height: 100%; background: var(--fg); }

/* Room */
.map { position: relative; aspect-ratio: 16 / 10; border: 1.5px dashed var(--ln); border-radius: var(--r); background: var(--hi); }
.wall { position: absolute; border: 0; cursor: pointer; padding: 0; background: transparent; color: inherit; display: flex; gap: 4px; text-align: left; }
.wall .strip { display: block; border-radius: 4px; background: var(--cd); border: 1.5px solid var(--ln); flex: none; }
.wall.on .strip { background: var(--ac); border-color: var(--ac); }
.wall.wait .strip { background: repeating-linear-gradient(90deg, var(--ac) 0 8px, var(--cd) 8px 14px); animation: pend 1.2s linear infinite; }
.wall.bad .strip { border: 2px dashed var(--bd); }
.wall.main { left: 6%; right: 6%; top: 6px; height: 46%; flex-direction: column; }
.wall.main .strip { width: 100%; height: 14px; }
.wall.paint { right: 6px; top: 34%; bottom: 6%; width: 50%; flex-direction: row-reverse; align-items: center; text-align: right; gap: 8px; }
.wall.paint .strip { width: 14px; height: 100%; }
.wall .wl { font-size: var(--t2); font-weight: 700; display: block; }
.wall .ws { font: 500 var(--t1) var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--mu); display: block; }
.wall.bad .ws { color: var(--bd); }
.boxspot { position: absolute; left: 6%; bottom: 8%; width: 42%; display: flex; flex-direction: column; gap: 2px; }
.boxspot b { font-size: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scenes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
.scene { min-height: 92px; border-radius: var(--r); border: 1.5px solid var(--ln); background: var(--cd); color: var(--fg); padding: var(--s3); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: var(--s1); cursor: pointer; text-align: left; }
.scene b { font-size: var(--t3); }
.scene small { font-size: 12px; color: var(--mu); line-height: 1.25; }
.scene[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--on); }
.scene[aria-pressed="true"] small { color: var(--on); }
.scene.armed { background: var(--bd); border-color: var(--bd); color: var(--bg); }
.scene.armed small { color: var(--bg); }
.scene[disabled] { cursor: default; }
.job { font-size: var(--t2); border: 1.5px solid var(--ln); border-radius: var(--r); padding: var(--s2) var(--s3); background: var(--cd); }
.job.bad { border-color: var(--bd); }
.job div + div { margin-top: 2px; }

/* Live */
.perf { display: flex; flex-direction: column; gap: var(--s3); }
.perf .left, .perf .right { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.banks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.banks button { min-width: 0; min-height: 44px; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1.5px solid var(--ln); border-radius: var(--r); background: var(--cd); font-weight: 600; cursor: pointer; font-size: var(--t2); color: var(--fg); }
.banks button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--on); }
.pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); position: relative; }
.pad { min-height: 64px; border-radius: var(--r); border: 1.5px solid var(--ln); background: var(--cd); color: var(--fg); padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; cursor: pointer; position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; gap: 6px; }
.pad .pn { display: flex; flex-wrap: wrap; justify-content: space-between; font: 500 11px var(--mono); color: var(--mu); gap: 4px; }
.pad .pl { font-weight: 700; font-size: var(--t2); line-height: 1.15; overflow-wrap: anywhere; }
.pad.empty { border-style: dashed; color: var(--mu); background: transparent; }
.pad.playing { background: var(--ac); border-color: var(--ac); color: var(--on); }
.pad.playing .pn { color: var(--on); }
.pad .prog { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--on); opacity: .7; }
.pad.wide { grid-column: 1 / -1; min-height: 60px; }
.mixer { background: var(--cd); border: 1.5px solid var(--ln); border-radius: var(--r); padding: var(--s2) 6px; display: flex; flex-direction: column; gap: var(--s1); }
.params { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; }
.params button { min-width: 0; min-height: 48px; padding: 2px 0; border-radius: var(--r); border: 1.5px solid transparent; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; color: var(--fg); }
.params button span { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mu); }
.params button b { font-family: var(--mono); font-size: var(--t2); font-variant-numeric: tabular-nums; }
.params button[aria-pressed="true"] { border-color: var(--ln); background: var(--hi); }
.params button.changed b { color: var(--ac); }
.fader { display: flex; gap: var(--s2); align-items: center; }
.fader input { flex: 1; min-width: 0; height: 44px; accent-color: var(--ac); }
.fader .val { font: 700 var(--t4) var(--mono); min-width: 4.4ch; text-align: right; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
.keys .btn { min-height: 44px; padding: 0 4px; font-size: var(--t2); position: relative; overflow: hidden; }
.keys .btn small { font: 500 10px var(--mono); opacity: .75; }
.hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--bd); opacity: .35; pointer-events: none; }
.hold.holding .fill { width: 100%; transition: width .6s linear; }
.lockcover { position: absolute; inset: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: var(--r); display: flex; align-items: center; justify-content: center; }
.fadelvl { position: absolute; left: 0; bottom: 0; height: 3px; background: currentColor; opacity: .7; }

/* Sheets and toast */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow: auto; background: var(--bg); border: 1.5px solid var(--ln); border-bottom: 0; border-radius: 14px 14px 0 0; padding: var(--s3) var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.sheet .grab { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--ln); }
.seg2 { display: flex; gap: var(--s2); flex-wrap: wrap; }
.seg2 .btn { flex: 1 1 0; min-width: 64px; padding: 0 var(--s2); }
.snap { aspect-ratio: 16 / 9; border-radius: var(--r); border: 1.5px solid var(--ln); display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; font: 500 var(--t1) var(--mono); color: #fff; background: radial-gradient(circle at 30% 40%, #3a8bd8, transparent 55%), radial-gradient(circle at 70% 60%, #b84bd8, transparent 50%), #050510; }
.snap.black { background: #000; color: #888; }
.app[data-theme="night-red"] .snap { filter: grayscale(1) sepia(1) hue-rotate(-50deg) saturate(4) brightness(.6); }
.toast { position: absolute; left: var(--s4); right: var(--s4); bottom: 92px; z-index: 30; background: var(--fg); color: var(--bg); border-radius: var(--r); padding: var(--s2) var(--s2) var(--s2) var(--s4); min-height: 56px; font-size: var(--t2); font-weight: 600; display: flex; gap: var(--s2); align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.toast.attop { top: var(--s3); bottom: auto; }
.app.stale .scroll > * { opacity: .55; filter: saturate(.4); }
.toast.bad { background: var(--bd); color: var(--bg); }
.toast .grow { flex: 1; }
.toast button { min-height: 44px; border-radius: var(--r); border: 1.5px solid currentColor; background: transparent; color: inherit; padding: 0 var(--s3); font-weight: 700; cursor: pointer; }

/* Setup */
.pagehead { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.pagehead .lbl { flex-basis: 100%; }
.pagebody { display: flex; flex-direction: column; gap: var(--s3); }
.list { display: flex; flex-direction: column; border: 1.5px solid var(--ln); border-radius: var(--r); overflow: hidden; background: var(--cd); }
.item { display: flex; gap: var(--s3); align-items: center; min-height: 60px; padding: var(--s2) var(--s4); border: 0; border-top: 1.5px solid var(--ln); background: transparent; color: inherit; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
div.item { cursor: default; }
.item .grow b { display: block; font-size: var(--t3); }
.item .grow > span { display: block; font-size: var(--t2); color: var(--mu); }
.item .chev { color: var(--mu); }
.item[aria-current="true"] { background: var(--hi); }
.item .acts { display: flex; gap: var(--s1); flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl2 { font-size: var(--t2); font-weight: 600; }
